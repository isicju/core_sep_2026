<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Applications</title>
    <style>
        :root {
            --bg: #f0f4f8;
            --card: #ffffff;
            --text: #1a202c;
            --muted: #718096;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .subtitle {
            color: var(--muted);
            font-size: 0.95rem;
            margin-top: 0.25rem;
        }

        .btn {
            background: #3182ce;
            color: white;
            border: none;
            padding: 0.6rem 1.25rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background: #2b6cb0;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .stats {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .stat {
            background: var(--card);
            padding: 0.75rem 1.25rem;
            border-radius: 10px;
            box-shadow: var(--shadow);
            font-size: 0.9rem;
            font-weight: 600;
        }

        .stat span {
            margin-left: 0.4rem;
            opacity: 0.8;
        }

        .table-wrapper {
            background: var(--card);
            border-radius: 12px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #edf2f7;
            text-align: left;
            padding: 1rem 1.25rem;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--muted);
            font-weight: 600;
            white-space: nowrap;
        }

        td {
            padding: 1rem 1.25rem;
            border-top: 1px solid var(--border);
            font-size: 0.95rem;
            vertical-align: middle;
        }

        tr:hover td {
            background: #f7fafc;
        }

        .name {
            font-weight: 600;
        }

        .money {
            font-variant-numeric: tabular-nums;
            font-family: 'SF Mono', 'Consolas', monospace;
        }

        .badge {
            display: inline-block;
            padding: 0.3rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        .badge-new {
            background: #bee3f8;
            color: #2b6cb0;
        }

        .badge-approved {
            background: #c6f6d5;
            color: #276749;
        }

        .badge-rejected {
            background: #fed7d7;
            color: #c53030;
        }

        .badge-draft {
            background: #fefcbf;
            color: #975a16;
        }

        .comments {
            max-width: 220px;
            color: var(--muted);
            font-size: 0.875rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .comments:hover {
            white-space: normal;
            overflow: visible;
        }

        .loading, .error, .empty {
            text-align: center;
            padding: 3rem;
            color: var(--muted);
        }

        .error {
            color: #c53030;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e2e8f0;
            border-top-color: #3182ce;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 900px) {
            .table-wrapper {
                overflow-x: auto;
            }
            table {
                min-width: 800px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div>
            <h1>Loan Applications</h1>
            <p class="subtitle">Manage and review incoming loan requests</p>
        </div>
        <button class="btn" onclick="loadApplications()">
            ↻ Refresh
        </button>
    </header>

    <div class="stats" id="stats"></div>

    <div class="table-wrapper">
        <div id="content">
            <div class="loading">
                <div class="spinner"></div>
                Loading applications…
            </div>
        </div>
    </div>
</div>

<script>
    const API_URL = 'http://localhost:8080/loanapplications'; // change if needed

    const statusClass = {
        NEW: 'badge-new',
        APPROVED: 'badge-approved',
        REJECTED: 'badge-rejected',
        DRAFT: 'badge-draft'
    };

    function formatMoney(value) {
        if (value == null) return '—';
        return new Intl.NumberFormat('en-US', {
            style: 'currency',
            currency: 'USD',
            maximumFractionDigits: 0
        }).format(value);
    }

    function renderStats(apps) {
        const counts = { NEW: 0, APPROVED: 0, REJECTED: 0, DRAFT: 0 };
        apps.forEach(a => counts[a.status] = (counts[a.status] || 0) + 1);

        document.getElementById('stats').innerHTML = `
        <div class="stat">Total <span>${apps.length}</span></div>
        <div class="stat" style="color:#2b6cb0">New <span>${counts.NEW}</span></div>
        <div class="stat" style="color:#276749">Approved <span>${counts.APPROVED}</span></div>
        <div class="stat" style="color:#c53030">Rejected <span>${counts.REJECTED}</span></div>
        <div class="stat" style="color:#975a16">Draft <span>${counts.DRAFT}</span></div>
      `;
    }

    function renderTable(apps) {
        if (!apps.length) {
            document.getElementById('content').innerHTML = `
          <div class="empty">No loan applications found.</div>
        `;
            return;
        }

        const rows = apps.map(app => `
        <tr>
          <td class="name">${app.firstName || ''} ${app.lastName || ''}</td>
          <td class="money">${formatMoney(app.monthlyIncome)}</td>
          <td class="money">${formatMoney(app.propertyPrice)}</td>
          <td class="money">${formatMoney(app.firstPayment)}</td>
          <td class="money">${formatMoney(app.expectedMonthlyPayment)}</td>
          <td>${app.loanTermYears ?? '—'} yrs</td>
          <td>
            <span class="badge ${statusClass[app.status] || ''}">
              ${app.status || '—'}
            </span>
          </td>
          <td class="comments" title="${app.analystComments || ''}">
            ${app.analystComments || '—'}
          </td>
        </tr>
      `).join('');

        document.getElementById('content').innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Applicant</th>
              <th>Monthly Income</th>
              <th>Property Price</th>
              <th>First Payment</th>
              <th>Expected Payment</th>
              <th>Term</th>
              <th>Status</th>
              <th>Comments</th>
            </tr>
          </thead>
          <tbody>
            ${rows}
          </tbody>
        </table>
      `;
    }

    async function loadApplications() {
        const content = document.getElementById('content');
        content.innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          Loading applications…
        </div>
      `;

        try {
            const res = await fetch(API_URL);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const apps = await res.json();
            renderStats(apps);
            renderTable(apps);
        } catch (err) {
            content.innerHTML = `
          <div class="error">
            Failed to load applications.<br>
            <small>${err.message}</small><br><br>
            Make sure the backend is running and CORS is enabled.
          </div>
        `;
            document.getElementById('stats').innerHTML = '';
        }
    }

    // Initial load
    loadApplications();
</script>
</body>
</html>

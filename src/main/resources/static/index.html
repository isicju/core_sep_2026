<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Users</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, sans-serif; background: #f4f5f7; color: #1f2430; }
        header { display: flex; gap: 12px; align-items: center; padding: 16px 24px; background: #fff; border-bottom: 1px solid #e2e4e9; }
        h1 { font-size: 20px; margin: 0; flex: 1; }
        label { font-size: 14px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
        input[type="number"] { padding: 7px 10px; border: 1px solid #ccd0d8; border-radius: 6px; font-size: 14px; width: 90px; }
        input[type="text"] { padding: 8px 12px; border: 1px solid #ccd0d8; border-radius: 6px; font-size: 14px; width: 180px; }
        input[type="search"] { padding: 8px 12px; border: 1px solid #ccd0d8; border-radius: 6px; font-size: 14px; width: 260px; }
        button { padding: 8px 14px; border: 0; border-radius: 6px; background: #2f6fed; color: #fff; font-size: 14px; cursor: pointer; }
        button:hover { background: #2559c4; }
        main { padding: 24px; overflow-x: auto; }
        #status { padding: 12px 0; color: #667; }
        #status.error { color: #c0392b; }
        #conn { font-size: 13px; padding: 4px 10px; border-radius: 12px; background: #fdecea; color: #c0392b; }
        #conn.online { background: #e6f6ec; color: #1e8449; }
        .grid { display: grid; grid-template-columns: 60px 1.2fr 110px 1fr 1.6fr 1.6fr 1.2fr; min-width: 960px; background: #fff; border: 1px solid #e2e4e9; border-radius: 8px; overflow: hidden; }
        .cell { padding: 10px 14px; border-bottom: 1px solid #eef0f3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .head { background: #fafbfc; font-weight: 600; font-size: 13px; cursor: pointer; user-select: none; }
        .head:hover { background: #f0f2f5; }
        .row:hover .cell { background: #f7faff; }
    </style>
</head>
<body>
<header>
    <h1>Users <small id="count"></small></h1>
    <span id="conn">offline</span>
    <label><input id="emailToggle" type="checkbox"> Email search</label>
    <input id="emailChars" type="text" placeholder="min 3 chars of email" autocomplete="off">

    <label><input id="delayToggle" type="checkbox"> Add delay</label>
    <input id="delayValue" type="number" min="0" step="1" placeholder="Delay (ms)">

    <input id="filter" type="search" placeholder="Filter by any field…">
    <button id="reload">Reload</button>
</header>
<main>
    <div id="status"></div>
    <div id="grid" class="grid" hidden></div>
</main>

<script>
    (function () {
        var WS_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/users';
        var COLUMNS = [
            { key: 'id', title: 'ID' },
            { key: 'name', title: 'Name' },
            { key: 'birthDate', title: 'Birth date' },
            { key: 'city', title: 'City' },
            { key: 'address', title: 'Address' },
            { key: 'email', title: 'Email' },
            { key: 'phone', title: 'Phone' }
        ];

        var MAX_ROWS = 500;
        var users = [];
        var sortKey = null;
        var sortAsc = true;

        var socket = null;
        var reconnectTimer = null;
        var lastRequestId = 0; // only the latest response is rendered

        var gridEl = document.getElementById('grid');
        var statusEl = document.getElementById('status');
        var countEl = document.getElementById('count');
        var connEl = document.getElementById('conn');
        var filterEl = document.getElementById('filter');
        var emailToggleEl = document.getElementById('emailToggle');
        var emailCharsEl = document.getElementById('emailChars');
        var emailTimer = null;
        var delayToggleEl = document.getElementById('delayToggle');
        var delayValueEl = document.getElementById('delayValue');

        function formatDate(v) {
            if (Array.isArray(v)) {
                return v[0] + '-' + String(v[1]).padStart(2, '0') + '-' + String(v[2]).padStart(2, '0');
            }
            return v == null ? '' : String(v);
        }

        function valueOf(user, key) {
            return key === 'birthDate' ? formatDate(user[key]) : (user[key] == null ? '' : user[key]);
        }

        function visibleUsers() {
            var q = filterEl.value.trim().toLowerCase();
            var list = users.filter(function (u) {
                if (!q) return true;
                return COLUMNS.some(function (c) {
                    return String(valueOf(u, c.key)).toLowerCase().indexOf(q) !== -1;
                });
            });
            if (sortKey) {
                list.sort(function (a, b) {
                    var x = valueOf(a, sortKey), y = valueOf(b, sortKey);
                    var r = (typeof x === 'number' && typeof y === 'number')
                        ? x - y
                        : String(x).localeCompare(String(y));
                    return sortAsc ? r : -r;
                });
            }
            return list;
        }

        function cell(text, cls) {
            var d = document.createElement('div');
            d.className = 'cell' + (cls ? ' ' + cls : '');
            d.textContent = text;
            d.title = text;
            return d;
        }

        function render() {
            var all = visibleUsers();
            var list = all.slice(0, MAX_ROWS);
            gridEl.innerHTML = '';

            COLUMNS.forEach(function (c) {
                var arrow = sortKey === c.key ? (sortAsc ? ' ▲' : ' ▼') : '';
                var h = cell(c.title + arrow, 'head');
                h.addEventListener('click', function () {
                    if (sortKey === c.key) { sortAsc = !sortAsc; } else { sortKey = c.key; sortAsc = true; }
                    render();
                });
                gridEl.appendChild(h);
            });

            list.forEach(function (u) {
                COLUMNS.forEach(function (c) {
                    gridEl.appendChild(cell(String(valueOf(u, c.key)), 'row'));
                });
            });

            countEl.textContent = '(' + (all.length > MAX_ROWS ? 'first ' + list.length + ' of ' + all.length : all.length !== users.length ? all.length + ' of ' + users.length : list.length) + ')';
            gridEl.hidden = false;
            statusEl.textContent = list.length ? '' : 'No users found.';
            statusEl.className = '';
        }

        function showError(msg) {
            users = [];
            gridEl.innerHTML = '';
            gridEl.hidden = true;
            countEl.textContent = '';
            statusEl.textContent = msg;
            statusEl.className = 'error';
        }

        function setOnline(online) {
            connEl.textContent = online ? 'live' : 'offline';
            connEl.className = online ? 'online' : '';
        }

        function connect() {
            socket = new WebSocket(WS_URL);

            socket.onopen = function () {
                setOnline(true);
                load();
            };

            socket.onmessage = function (event) {
                var msg;
                try { msg = JSON.parse(event.data); } catch (e) { return; }
                if (String(msg.requestId) !== String(lastRequestId)) return; // stale response
                if (msg.error) { showError('Error: ' + msg.error); return; }
                users = Array.isArray(msg.data) ? msg.data : [];
                render();
            };

            socket.onclose = function () {
                setOnline(false);
                clearTimeout(reconnectTimer);
                reconnectTimer = setTimeout(connect, 2000); // auto-reconnect
            };

            socket.onerror = function () { socket.close(); };
        }

        function load() {
            sortKey = null;
            if (!socket || socket.readyState !== WebSocket.OPEN) {
                statusEl.className = '';
                statusEl.textContent = 'Connecting…';
                return; // onopen will call load()
            }

            var req = { requestId: ++lastRequestId };
            var email = emailCharsEl.value.trim();
            if (emailToggleEl.checked && email.length >= 3) req.email3Chars = email;
            if (delayToggleEl.checked && delayValueEl.value !== '') req.delay = Number(delayValueEl.value);

            statusEl.className = '';
            statusEl.textContent = 'Loading…';
            gridEl.hidden = true;
            socket.send(JSON.stringify(req));
        }

        emailToggleEl.addEventListener('change', load);
        emailCharsEl.addEventListener('input', function () {
            if (!emailToggleEl.checked) return;
            clearTimeout(emailTimer);
            emailTimer = setTimeout(load, 300);
        });
        filterEl.addEventListener('input', render);
        document.getElementById('reload').addEventListener('click', load);

        connect();
    })();
</script>
</body>
</html>

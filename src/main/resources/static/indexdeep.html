<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Applications · KotoJava</title>
    <!-- Font Awesome for subtle icons (optional) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* reset & base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: #f5f7fc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .app-card {
            max-width: 1280px;
            width: 100%;
            background: white;
            border-radius: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            transition: all 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(2px);
        }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.75rem 2rem;
            background: linear-gradient(145deg, #0b1e3c, #1b2f4e);
            color: white;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .header h1 i {
            color: #6ea8fe;
            font-size: 2rem;
        }

        .badge {
            background: #2a3f5e;
            padding: 0.4rem 1rem;
            border-radius: 100px;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.3px;
            color: #b6c9e8;
            border: 1px solid #3e5a7c;
            backdrop-filter: blur(4px);
        }

        .badge i {
            margin-right: 0.3rem;
            font-size: 0.75rem;
            color: #85b0ff;
        }

        /* toolbar */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 2rem;
            background: #ffffff;
            border-bottom: 1px solid #e9edf4;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: #f0f4fa;
            padding: 0.5rem 1rem;
            border-radius: 40px;
            border: 1px solid #d9e1ec;
            transition: all 0.15s;
            min-width: 280px;
        }

        .search-box:focus-within {
            border-color: #3b6cbf;
            box-shadow: 0 0 0 3px rgba(59, 108, 191, 0.1);
            background: white;
        }

        .search-box i {
            color: #7e8fa8;
            font-size: 0.95rem;
            margin-right: 0.6rem;
        }

        .search-box input {
            border: none;
            background: transparent;
            outline: none;
            font-size: 0.95rem;
            width: 100%;
            color: #1a2c44;
        }

        .search-box input::placeholder {
            color: #98a9c2;
            font-weight: 400;
        }

        .stats {
            font-size: 0.95rem;
            background: #eef4ff;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            color: #1e3f73;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            border: 1px solid #cddefa;
        }

        .stats i {
            color: #2f6ed4;
        }

        /* table container */
        .table-wrapper {
            padding: 0 1.5rem 1.5rem 1.5rem;
            overflow-x: auto;
        }

        .applications-table {
            width: 100%;
            border-collapse: collapse;
            border-spacing: 0;
            font-size: 0.95rem;
            min-width: 800px;
        }

        .applications-table th {
            text-align: left;
            padding: 1rem 1.2rem;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #4e6582;
            border-bottom: 1.5px solid #e2e9f3;
            background: #fafcff;
            white-space: nowrap;
        }

        .applications-table td {
            padding: 1.1rem 1.2rem;
            border-bottom: 1px solid #edf2f9;
            color: #1a2f4a;
            vertical-align: middle;
        }

        .applications-table tr:last-child td {
            border-bottom: none;
        }

        .applications-table tbody tr {
            transition: background 0.15s;
        }

        .applications-table tbody tr:hover {
            background: #f5f9ff;
        }

        /* borrower cell */
        .borrower-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: #d9e6ff;
            color: #1f4b9c;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            flex-shrink: 0;
            box-shadow: 0 2px 6px rgba(0, 40, 100, 0.08);
        }

        .borrower-detail {
            display: flex;
            flex-direction: column;
            line-height: 1.35;
        }

        .borrower-name {
            font-weight: 600;
            color: #0a1e38;
        }

        .borrower-email {
            font-size: 0.75rem;
            color: #627a9c;
        }

        /* amounts */
        .amount {
            font-weight: 600;
            color: #1d3c6e;
            white-space: nowrap;
        }

        .amount small {
            font-weight: 400;
            color: #7d93b2;
            font-size: 0.75rem;
        }

        /* status badges */
        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.3rem 0.8rem;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            white-space: nowrap;
            gap: 0.35rem;
        }

        .status-badge i {
            font-size: 0.65rem;
        }

        .status-approved {
            background: #e2f3e4;
            color: #1f6e3a;
        }

        .status-pending {
            background: #fff3d6;
            color: #9e6d0b;
        }

        .status-rejected {
            background: #ffe6e6;
            color: #b13e3e;
        }

        .status-review {
            background: #e3edff;
            color: #2b5db9;
        }

        /* loading & error states */
        .state-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
            background: #ffffff;
            text-align: center;
            gap: 1.5rem;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e2eaf6;
            border-top: 4px solid #1e4c9c;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #fff5f5;
            border: 1px solid #ffcdd2;
            color: #b71c1c;
            padding: 1.5rem 2rem;
            border-radius: 1.5rem;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
        }

        .error-message i {
            font-size: 2.2rem;
            color: #c62828;
        }

        .retry-btn {
            background: #1e3f73;
            color: white;
            border: none;
            padding: 0.7rem 1.8rem;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 0.5rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .retry-btn:hover {
            background: #0f2c52;
        }

        .empty-state {
            padding: 4rem 2rem;
            text-align: center;
            color: #5d738f;
        }

        .empty-state i {
            font-size: 3rem;
            color: #b7c8e0;
            margin-bottom: 1rem;
        }

        /* footer */
        .footer {
            padding: 1rem 2rem;
            background: #f9fbfe;
            border-top: 1px solid #e2e9f3;
            font-size: 0.8rem;
            color: #6a7f9c;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .footer i {
            color: #3c6ab3;
        }

        /* mobile */
        @media (max-width: 700px) {
            body { padding: 1rem 0.5rem; }
            .header { flex-direction: column; align-items: flex-start; gap: 0.7rem; padding: 1.25rem 1.5rem; }
            .header h1 { font-size: 1.4rem; }
            .toolbar { flex-direction: column; align-items: stretch; gap: 0.8rem; padding: 1rem 1.5rem; }
            .search-box { min-width: 0; }
            .table-wrapper { padding: 0 0.75rem 1rem 0.75rem; }
        }
    </style>
</head>
<body>

<div class="app-card">
    <!-- header -->
    <div class="header">
        <h1>
            <i class="fas fa-file-invoice"></i>
            Loan Applications
        </h1>
        <div class="badge">
            <i class="fas fa-code-branch"></i> GET /loanapplications
        </div>
    </div>

    <!-- toolbar -->
    <div class="toolbar">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search by applicant, email, or purpose...">
        </div>
        <div class="stats">
            <i class="fas fa-database"></i>
            <span id="appCount">—</span> applications
        </div>
    </div>

    <!-- main content: either loading, error, or table -->
    <div id="contentArea">
        <!-- dynamic: loading, error, table -->
        <div class="state-container" id="loadingState">
            <div class="spinner"></div>
            <p style="color: #4b6589; font-weight: 500;">Fetching loan applications…</p>
        </div>
    </div>

    <!-- footer -->
    <div class="footer">
        <span><i class="fas fa-server"></i> kotojava.lesson3 · ApplicationController</span>
        <span><i class="fas fa-shield-alt"></i> REST endpoint</span>
    </div>
</div>

<script>
    (function() {
        // ---------- CONFIG ----------
        // Use relative URL to match the controller's base path.
        // In a real app served from the same origin as Spring Boot, this works.
        const API_URL = '/loanapplications';

        // ---------- DOM elements ----------
        const contentArea = document.getElementById('contentArea');
        const appCountSpan = document.getElementById('appCount');
        const searchInput = document.getElementById('searchInput');

        // ---------- state ----------
        let allApplications = [];        // full dataset from API
        let filteredApplications = [];   // after search filter

        // ---------- helper: escape HTML (to avoid XSS) ----------
        function escapeHtml(unsafe) {
            if (unsafe === null || unsafe === undefined) return '';
            return String(unsafe)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // ---------- helper: generate initials ----------
        function getInitials(name) {
            if (!name) return '?';
            const parts = name.trim().split(/\s+/);
            if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
            return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
        }

        // ---------- helper: format currency ----------
        function formatCurrency(amount, currency = 'USD') {
            if (amount === undefined || amount === null) return '—';
            try {
                return new Intl.NumberFormat('en-US', {
                    style: 'currency',
                    currency: currency,
                    minimumFractionDigits: 0,
                    maximumFractionDigits: 0,
                }).format(amount);
            } catch (e) {
                return `$${Number(amount).toLocaleString()}`;
            }
        }

        // ---------- helper: format date ----------
        function formatDate(dateString) {
            if (!dateString) return '—';
            try {
                const d = new Date(dateString);
                if (isNaN(d.getTime())) return dateString;
                return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
            } catch (e) {
                return dateString;
            }
        }

        // ---------- helper: determine status info ----------
        function getStatusInfo(status) {
            const s = (status || '').toLowerCase();
            if (s.includes('approv')) return { text: 'Approved', class: 'status-approved', icon: 'fa-check-circle' };
            if (s.includes('pend')) return { text: 'Pending', class: 'status-pending', icon: 'fa-clock' };
            if (s.includes('reject') || s.includes('denied')) return { text: 'Rejected', class: 'status-rejected', icon: 'fa-times-circle' };
            if (s.includes('review') || s.includes('process')) return { text: 'In Review', class: 'status-review', icon: 'fa-search' };
            // fallback
            return { text: status || 'Unknown', class: 'status-review', icon: 'fa-circle' };
        }

        // ---------- render table from a given array ----------
        function renderTable(applications) {
            if (!applications || applications.length === 0) {
                contentArea.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-folder-open"></i>
            <h3 style="font-weight: 500; color: #2b3f5e; margin-bottom: 0.25rem;">No loan applications found</h3>
            <p style="font-size: 0.9rem;">Try adjusting your search or check back later.</p>
          </div>
        `;
                appCountSpan.textContent = '0';
                return;
            }

            // update count
            appCountSpan.textContent = applications.length;

            // build rows
            const rowsHtml = applications.map(app => {
                // ---- safely extract fields with fallbacks ----
                const id = escapeHtml(app.id ?? '—');
                const fullName = escapeHtml(app.applicantName ?? app.borrowerName ?? app.customerName ?? 'Unknown');
                const email = escapeHtml(app.email ?? app.applicantEmail ?? app.borrowerEmail ?? '—');
                const amount = app.amount ?? app.loanAmount ?? app.requestedAmount ?? null;
                const purpose = escapeHtml(app.purpose ?? app.loanPurpose ?? '—');
                const statusRaw = app.status ?? app.applicationStatus ?? 'Pending';
                const statusInfo = getStatusInfo(statusRaw);
                const submittedRaw = app.submittedAt ?? app.applicationDate ?? app.createdAt ?? null;
                const submitted = formatDate(submittedRaw);
                const currency = app.currency ?? 'USD';

                const initials = getInitials(fullName !== 'Unknown' ? fullName : (email !== '—' ? email : '?'));

                // avatar color variation based on first letter
                const charCode = initials.charCodeAt(0) || 65;
                const hue = (charCode * 37) % 360;
                const avatarBg = `hsl(${hue}, 70%, 88%)`;
                const avatarColor = `hsl(${hue}, 70%, 28%)`;

                return `
          <tr>
            <td>
              <div class="borrower-info">
                <div class="avatar" style="background: ${avatarBg}; color: ${avatarColor};">
                  ${escapeHtml(initials)}
                </div>
                <div class="borrower-detail">
                  <span class="borrower-name">${fullName}</span>
                  <span class="borrower-email">${email}</span>
                </div>
              </div>
            </td>
            <td>
              <span class="amount">${formatCurrency(amount, currency)}</span>
            </td>
            <td>${purpose}</td>
            <td>
              <span class="status-badge ${statusInfo.class}">
                <i class="fas ${statusInfo.icon}"></i> ${statusInfo.text}
              </span>
            </td>
            <td style="color: #47638b; font-size: 0.9rem; white-space: nowrap;">${submitted}</td>
            <td style="color: #8da1bd; font-weight: 500;">#${id}</td>
          </tr>
        `;
            }).join('');

            contentArea.innerHTML = `
        <div class="table-wrapper">
          <table class="applications-table">
            <thead>
              <tr>
                <th>Applicant</th>
                <th>Amount</th>
                <th>Purpose</th>
                <th>Status</th>
                <th>Submitted</th>
                <th>ID</th>
              </tr>
            </thead>
            <tbody>
              ${rowsHtml}
            </tbody>
          </table>
        </div>
      `;
        }

        // ---------- apply search filter ----------
        function applyFilter() {
            const query = searchInput.value.trim().toLowerCase();
            if (!query) {
                filteredApplications = [...allApplications];
            } else {
                filteredApplications = allApplications.filter(app => {
                    const name = (app.applicantName ?? app.borrowerName ?? app.customerName ?? '').toLowerCase();
                    const email = (app.email ?? app.applicantEmail ?? app.borrowerEmail ?? '').toLowerCase();
                    const purpose = (app.purpose ?? app.loanPurpose ?? '').toLowerCase();
                    const status = (app.status ?? app.applicationStatus ?? '').toLowerCase();
                    const id = String(app.id ?? '');
                    return name.includes(query) || email.includes(query) || purpose.includes(query) || status.includes(query) || id.includes(query);
                });
            }
            renderTable(filteredApplications);
        }

        // ---------- fetch data from API ----------
        async function fetchApplications() {
            // show loading state
            contentArea.innerHTML = `
        <div class="state-container" id="loadingState">
          <div class="spinner"></div>
          <p style="color: #4b6589; font-weight: 500;">Fetching loan applications…</p>
        </div>
      `;
            appCountSpan.textContent = '—';

            try {
                const response = await fetch(API_URL, {
                    headers: { 'Accept': 'application/json' },
                });

                if (!response.ok) {
                    throw new Error(`Server responded with ${response.status} ${response.statusText}`);
                }

                const data = await response.json();

                // Ensure data is an array; if not, try to extract from common wrappers
                let applications = [];
                if (Array.isArray(data)) {
                    applications = data;
                } else if (data && typeof data === 'object' && Array.isArray(data.content)) {
                    // in case of paginated response
                    applications = data.content;
                } else if (data && typeof data === 'object' && Array.isArray(data.loanApplications)) {
                    applications = data.loanApplications;
                } else {
                    // fallback: if it's a single object, wrap in array
                    applications = data ? [data] : [];
                }

                // store in state
                allApplications = applications;
                filteredApplications = [...allApplications];

                // update count & render
                renderTable(filteredApplications);
            } catch (error) {
                console.error('Failed to fetch loan applications:', error);
                contentArea.innerHTML = `
          <div class="state-container">
            <div class="error-message">
              <i class="fas fa-exclamation-triangle"></i>
              <h3 style="font-weight: 500; margin-bottom: 0.25rem;">Unable to load applications</h3>
              <p style="font-size: 0.9rem; color: #8b3a3a;">${escapeHtml(error.message || 'Network error')}</p>
              <button class="retry-btn" id="retryBtn">
                <i class="fas fa-sync-alt"></i> Retry
              </button>
            </div>
          </div>
        `;
                appCountSpan.textContent = '0';

                // attach retry listener
                const retryBtn = document.getElementById('retryBtn');
                if (retryBtn) {
                    retryBtn.addEventListener('click', fetchApplications);
                }
            }
        }

        // ---------- search listener ----------
        searchInput.addEventListener('input', applyFilter);

        // ---------- initial fetch ----------
        fetchApplications();

        // optional: expose a global refresh for debugging
        window.refreshApplications = fetchApplications;
    })();
</script>
</body>
</html>

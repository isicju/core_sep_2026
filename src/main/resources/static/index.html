<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Users</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, sans-serif; background: #f4f5f7; color: #1f2430; }
        header { display: flex; gap: 12px; align-items: center; padding: 16px 24px; background: #fff; border-bottom: 1px solid #e2e4e9; }
        h1 { font-size: 20px; margin: 0; flex: 1; }
        label { font-size: 14px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
        input[type="date"] { padding: 7px 10px; border: 1px solid #ccd0d8; border-radius: 6px; font-size: 14px; }
        input[type="number"] { padding: 7px 10px; border: 1px solid #ccd0d8; border-radius: 6px; font-size: 14px; width: 90px; }
        input[type="text"] { padding: 8px 12px; border: 1px solid #ccd0d8; border-radius: 6px; font-size: 14px; width: 180px; }
        input[type="search"] { padding: 8px 12px; border: 1px solid #ccd0d8; border-radius: 6px; font-size: 14px; width: 260px; }
        button { padding: 8px 14px; border: 0; border-radius: 6px; background: #2f6fed; color: #fff; font-size: 14px; cursor: pointer; }
        button:hover { background: #2559c4; }
        main { padding: 24px; overflow-x: auto; }
        #status { padding: 12px 0; color: #667; }
        #status.error { color: #c0392b; }
        .grid { display: grid; grid-template-columns: 60px 1.2fr 110px 1fr 1.6fr 1.6fr 1.2fr; min-width: 960px; background: #fff; border: 1px solid #e2e4e9; border-radius: 8px; overflow: hidden; }
        .cell { padding: 10px 14px; border-bottom: 1px solid #eef0f3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .head { background: #fafbfc; font-weight: 600; font-size: 13px; cursor: pointer; user-select: none; }
        .head:hover { background: #f0f2f5; }
        .row:hover .cell { background: #f7faff; }
    </style>
</head>
<body>
<header>
    <h1>Users <small id="count"></small></h1>
    <label><input id="sortedToggle" type="checkbox"> Sorted by name (server)</label>
    <label>Birth date <input id="dobPicker" type="date"></label>
    <label><input id="rangeToggle" type="checkbox"> Date range</label>
    <label>From <input id="dobAfter" type="date"></label>
    <label>To <input id="dobBefore" type="date"></label>
    <label><input id="yearToggle" type="checkbox"> By year</label>
    <input id="dobYear" type="number" min="1900" max="2100" step="1" placeholder="YYYY">
    <label><input id="emailToggle" type="checkbox"> Email search</label>
    <label><input id="delayToggle" type="checkbox"> Add delay</label>
    <input id="emailChars" type="text" placeholder="min 3 chars of email" autocomplete="off">
    <input id="filter" type="search" placeholder="Filter by any field…">
    <button id="reload">Reload</button>
</header>
<main>
    <div id="status"></div>
    <div id="grid" class="grid" hidden></div>
</main>

<script>
    (function () {
        var API_URL = `${window.location.origin}/users`;
        var COLUMNS = [
            { key: 'id', title: 'ID' },
            { key: 'name', title: 'Name' },
            { key: 'birthDate', title: 'Birth date' },
            { key: 'city', title: 'City' },
            { key: 'address', title: 'Address' },
            { key: 'email', title: 'Email' },
            { key: 'phone', title: 'Phone' }
        ];

        var MAX_ROWS = 500;
        var users = [];
        var sortKey = null;
        var sortAsc = true;

        var gridEl = document.getElementById('grid');
        var statusEl = document.getElementById('status');
        var countEl = document.getElementById('count');
        var filterEl = document.getElementById('filter');
        var sortedToggleEl = document.getElementById('sortedToggle');
        var dobPickerEl = document.getElementById('dobPicker');
        var emailToggleEl = document.getElementById('emailToggle');
        var emailCharsEl = document.getElementById('emailChars');
        var emailTimer = null;
        var yearToggleEl = document.getElementById('yearToggle');
        var dobYearEl = document.getElementById('dobYear');
        var rangeToggleEl = document.getElementById('rangeToggle');
        var dobAfterEl = document.getElementById('dobAfter');
        var dobBeforeEl = document.getElementById('dobBefore');
        var delayToggleEl = document.getElementById('delayToggle');

        // Jackson may send LocalDate as "2000-01-31" or as [2000, 1, 31]
        function formatDate(v) {
            if (Array.isArray(v)) {
                return v[0] + '-' + String(v[1]).padStart(2, '0') + '-' + String(v[2]).padStart(2, '0');
            }
            return v == null ? '' : String(v);
        }

        function valueOf(user, key) {
            return key === 'birthDate' ? formatDate(user[key]) : (user[key] == null ? '' : user[key]);
        }

        function visibleUsers() {
            var q = filterEl.value.trim().toLowerCase();
            var list = users.filter(function (u) {
                if (!q) return true;
                return COLUMNS.some(function (c) {
                    return String(valueOf(u, c.key)).toLowerCase().indexOf(q) !== -1;
                });
            });
            if (sortKey) {
                list.sort(function (a, b) {
                    var x = valueOf(a, sortKey), y = valueOf(b, sortKey);
                    var r = (typeof x === 'number' && typeof y === 'number')
                        ? x - y
                        : String(x).localeCompare(String(y));
                    return sortAsc ? r : -r;
                });
            }
            return list;
        }

        function cell(text, cls) {
            var d = document.createElement('div');
            d.className = 'cell' + (cls ? ' ' + cls : '');
            d.textContent = text;
            d.title = text;
            return d;
        }

        function render() {
            var all = visibleUsers();
            var list = all.slice(0, MAX_ROWS); // UI-side limit
            gridEl.innerHTML = '';

            COLUMNS.forEach(function (c) {
                var arrow = sortKey === c.key ? (sortAsc ? ' ▲' : ' ▼') : '';
                var h = cell(c.title + arrow, 'head');
                h.addEventListener('click', function () {
                    if (sortKey === c.key) { sortAsc = !sortAsc; } else { sortKey = c.key; sortAsc = true; }
                    render();
                });
                gridEl.appendChild(h);
            });

            list.forEach(function (u) {
                COLUMNS.forEach(function (c) {
                    gridEl.appendChild(cell(String(valueOf(u, c.key)), 'row'));
                });
            });

            countEl.textContent = '(' + (all.length > MAX_ROWS ? 'first ' + list.length + ' of ' + all.length : all.length !== users.length ? all.length + ' of ' + users.length : list.length) + ')';
            gridEl.hidden = false;
            statusEl.textContent = list.length ? '' : 'No users found.';
            statusEl.className = '';
        }

        function load() {
            sortKey = null; // every server call shows the server's own order
            var params = [];
            if (sortedToggleEl.checked) params.push('sorted=name');
            if (dobPickerEl.value) params.push('dob=' + encodeURIComponent(dobPickerEl.value)); // yyyy-MM-dd
            if (rangeToggleEl.checked) { // range params are sent only when ticked
                if (dobAfterEl.value) params.push('dobBefore=' + encodeURIComponent(dobAfterEl.value));  // From
                if (dobBeforeEl.value) params.push('dobAfter=' + encodeURIComponent(dobBeforeEl.value)); // To
            }
            if (yearToggleEl.checked && dobYearEl.value) { // year param is sent only when ticked
                params.push('dobYear=' + encodeURIComponent(dobYearEl.value));
            }
            var email = emailCharsEl.value.trim();
            if (emailToggleEl.checked && email.length >= 3) { // sent only when ticked and 3+ chars typed
                params.push('email3Chars=' + encodeURIComponent(email));
            }
            if (delayToggleEl.checked) params.push('delay');
            var url = API_URL + (params.length ? '?' + params.join('&') : '');
            statusEl.className = '';
            statusEl.textContent = 'Loading…';
            gridEl.hidden = true;
            fetch(url, { headers: { 'Accept': 'application/json' } })
                .then(function (res) {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.text(); // read as text first: the body may be empty (e.g. no match)
                })
                .then(function (text) {
                    var data = null;
                    if (text && text.trim()) {
                        try { data = JSON.parse(text); } catch (e) { data = null; }
                    }
                    // empty body, null, or unparsable -> empty list
                    users = Array.isArray(data) ? data : (data && data.content) || [];
                    render();
                })
                .catch(function (err) {
                    users = [];
                    gridEl.innerHTML = '';
                    gridEl.hidden = false;
                    statusEl.textContent = '';
                    statusEl.className = '';
                    countEl.textContent = '';
                });
        }

        sortedToggleEl.addEventListener('change', function () {
            sortKey = null; // let the server's order show
            load();
        });
        emailToggleEl.addEventListener('change', load);
        emailCharsEl.addEventListener('input', function () {
            if (!emailToggleEl.checked) return; // ignored while the box is unticked
            clearTimeout(emailTimer);
            emailTimer = setTimeout(load, 300); // wait for the user to pause typing
        });
        yearToggleEl.addEventListener('change', load);
        dobYearEl.addEventListener('change', function () {
            if (yearToggleEl.checked) load(); // ignored while the box is unticked
        });
        rangeToggleEl.addEventListener('change', load);
        [dobAfterEl, dobBeforeEl].forEach(function (el) {
            el.addEventListener('change', function () {
                if (rangeToggleEl.checked) load(); // ignored while the box is unticked
            });
        });
        dobPickerEl.addEventListener('change', load); // empty value (cleared) loads without dob
        filterEl.addEventListener('input', render);
        document.getElementById('reload').addEventListener('click', load);
        load();
    })();
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Applications</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Inter, "Segoe UI", Arial, sans-serif;
            background: #f4f7fb;
            color: #172b4d;
        }

        header {
            background: #172b4d;
            color: white;
            padding: 20px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h2 { margin: 0; font-size: 22px; }
        header span { color: #b9c9e2; font-size: 14px; }

        main {
            max-width: 1500px;
            margin: 35px auto;
            padding: 0 24px;
        }

        .heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 26px;
        }

        h1 { margin: 0 0 8px; font-size: 30px; }
        .subtitle { color: #71819b; }

        input {
            padding: 12px 16px;
            border: 1px solid #d8e1ef;
            border-radius: 9px;
            font-size: 14px;
            min-width: 260px;
            outline: none;
        }

        input:focus {
            border-color: #3984ff;
            box-shadow: 0 0 0 3px #3984ff20;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat {
            background: white;
            padding: 20px;
            border: 1px solid #e5ebf4;
            border-radius: 12px;
            box-shadow: 0 3px 12px #172b4d08;
        }

        .stat-label { color: #71819b; font-size: 14px; }
        .stat-number { font-size: 28px; font-weight: 700; margin-top: 8px; }

        .blue { color: #1677ff; }
        .green { color: #16a34a; }
        .red { color: #dc2626; }
        .yellow { color: #ca8a04; }

        .table-card {
            background: white;
            border: 1px solid #e5ebf4;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 18px #172b4d08;
        }

        .table-scroll { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }

        th {
            text-align: left;
            background: #f8faff;
            color: #71819b;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .5px;
            padding: 16px;
        }

        td {
            padding: 17px 16px;
            border-top: 1px solid #edf1f7;
            font-size: 14px;
        }

        tbody tr:hover { background: #f8faff; }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            border-radius: 20px;
            padding: 6px 11px;
            font-size: 12px;
            font-weight: 700;
        }

        .badge::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
        }

        .badge.NEW { background: #e8f2ff; color: #1677ff; }
        .badge.APPROVED { background: #e5f8ee; color: #16a34a; }
        .badge.REJECTED { background: #feecec; color: #dc2626; }
        .badge.DRAFT { background: #fff5d9; color: #ca8a04; }

        .btn {
            display: inline-block;
            border: 1px solid #b9d5ff;
            color: #1677ff;
            background: white;
            border-radius: 7px;
            padding: 8px 12px;
            text-decoration: none;
            font-size: 13px;
            cursor: pointer;
        }

        .btn:hover { background: #edf5ff; }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px;
            color: #71819b;
            font-size: 13px;
        }

        .error {
            padding: 24px;
            color: #dc2626;
        }

        @media (max-width: 850px) {
            .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            main { margin-top: 24px; padding: 0 14px; }
            h1 { font-size: 25px; }
        }

        @media (max-width: 420px) {
            .stats { grid-template-columns: 1fr 1fr; gap: 8px; }
            .stat { padding: 14px; }
            input { min-width: 0; width: 100%; }
        }
    </style>
</head>
<body>
<header>
    <h2>⌂ Loan Manager</h2>
    <span>Mortgage Administration</span>
</header>

<main>
    <section class="heading">
        <div>
            <h1>Loan Applications</h1>
            <div class="subtitle">Manage and review all loan applications</div>
        </div>
        <input id="search" placeholder="⌕  Search by ID or name...">
    </section>

    <section class="stats">
        <div class="stat">
            <div class="stat-label">New applications</div>
            <div class="stat-number blue" id="newCount">0</div>
        </div>
        <div class="stat">
            <div class="stat-label">Approved</div>
            <div class="stat-number green" id="approvedCount">0</div>
        </div>
        <div class="stat">
            <div class="stat-label">Rejected</div>
            <div class="stat-number red" id="rejectedCount">0</div>
        </div>
        <div class="stat">
            <div class="stat-label">Drafts</div>
            <div class="stat-number yellow" id="draftCount">0</div>
        </div>
    </section>

    <section class="table-card">
        <div class="table-scroll">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Applicant</th>
                    <th>Monthly income</th>
                    <th>Property price</th>
                    <th>First payment</th>
                    <th>Loan term</th>
                    <th>Monthly payment</th>
                    <th>Status</th>
                    <th>Comments</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="applications">
                <tr><td colspan="10">Loading applications...</td></tr>
                </tbody>
            </table>
        </div>
        <div class="footer">
            <span id="total">Loading...</span>
            <button class="btn" onclick="loadApplications()">↻ Refresh</button>
        </div>
    </section>
</main>

<script>
    let applications = [];

    const money = value => value == null
        ? "—"
        : Number(value).toLocaleString("en-GB", {
            style: "currency",
            currency: "GBP"
        });

    function render() {
        const query = document.getElementById("search").value.toLowerCase();

        const filtered = applications.filter(a =>
            `${a.id} ${a.firstName} ${a.lastName}`
                .toLowerCase().includes(query)
        );

        document.getElementById("newCount").textContent =
            applications.filter(a => a.status === "NEW").length;
        document.getElementById("approvedCount").textContent =
            applications.filter(a => a.status === "APPROVED").length;
        document.getElementById("rejectedCount").textContent =
            applications.filter(a => a.status === "REJECTED").length;
        document.getElementById("draftCount").textContent =
            applications.filter(a => a.status === "DRAFT").length;

        document.getElementById("total").textContent =
            `Showing ${filtered.length} of ${applications.length} applications`;

        const tbody = document.getElementById("applications");

        if (!filtered.length) {
            tbody.innerHTML =
                '<tr><td colspan="10">No applications found.</td></tr>';
            return;
        }

        tbody.innerHTML = filtered.map(a => `
            <tr>
                <td><strong>${escapeHtml(a.id)}</strong></td>
                <td>${escapeHtml(a.firstName)} ${escapeHtml(a.lastName)}</td>
                <td>${money(a.monthlyIncome)}</td>
                <td>${money(a.propertyPrice)}</td>
                <td>${money(a.firstPayment)}</td>
                <td>${a.loanTermYears ?? "—"} years</td>
                <td>${money(a.expectedMonthlyPayment)}</td>
                <td><span class="badge ${statusClass(a.status)}">
                    ${escapeHtml(a.status ?? "UNKNOWN")}
                </span></td>
                <td>${escapeHtml(a.analystComments || "—")}</td>
                <td>
                    ${a.status === "APPROVED" || a.status === "REJECTED"
            ? `<a class="btn" href="/loanapplications/${encodeURIComponent(a.id)}/pdf">View PDF</a>`
            : "—"}
                </td>
            </tr>
        `).join("");
    }

    function statusClass(status) {
        return ["NEW", "APPROVED", "REJECTED", "DRAFT"].includes(status)
            ? status : "";
    }

    function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, ch => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[ch]);
    }

    async function loadApplications() {
        const tbody = document.getElementById("applications");

        try {
            const response = await fetch("/loanapplications");
            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            applications = await response.json();
            render();
        } catch (error) {
            tbody.innerHTML = `<tr><td colspan="10" class="error">
                Could not load applications. Check that the Spring Boot
                server is running. ${escapeHtml(error.message)}
            </td></tr>`;
            document.getElementById("total").textContent = "Request failed";
        }
    }

    document.getElementById("search").addEventListener("input", render);
    loadApplications();
</script>
</body>
</html>
